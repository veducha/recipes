name: Process New Recipe Submission

on:
  repository_dispatch:
    types: [new_recipe_submission]
  workflow_dispatch:
    inputs:
      recipe_title:
        description: 'Recipe Title'
        required: true
        type: string
      recipe_text:
        description: 'Recipe (free-form text)'
        required: true
        type: string
      image_url:
        description: 'Direct or Google Drive Image URL'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-recipe-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pillow requests

      - name: Process recipe with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RECIPE_TITLE: ${{ github.event.client_payload.recipe_title || inputs.recipe_title }}
          RECIPE_TEXT: ${{ github.event.client_payload.recipe_text || inputs.recipe_text }}
          IMAGE_URL: ${{ github.event.client_payload.image_url || inputs.image_url }}
        run: |
          python3 scripts/process_recipe.py

      - name: Create Branch and Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f .recipe_slug ]; then
            echo "Error: .recipe_slug was not created."
            exit 1
          fi

          SLUG=$(cat .recipe_slug)
          rm .recipe_slug

          BRANCH_NAME="recipe/${SLUG}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check out a new branch
          git checkout -b "$BRANCH_NAME"

          # Stage recipe markdown and optional hero image
          git add "recipes/${SLUG}.md"
          if [ -f "images/${SLUG}.jpg" ]; then
            git add "images/${SLUG}.jpg"
          fi

          git commit -m "Add recipe: ${SLUG}"
          git push -u origin "$BRANCH_NAME"

          # Open pull request
          PR_URL=$(gh pr create \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Add Recipe: ${SLUG}" \
            --body "Automated recipe submission from Google Form.

- **Markdown**: \`recipes/${SLUG}.md\`
- **Hero Image**: \`images/${SLUG}.jpg\` (included if uploaded)

Review the recipe and merge when ready!")

          echo "Created Pull Request: $PR_URL"
